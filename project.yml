name: DeskPetPomodoro
options:
  bundleIdPrefix: com.deskpetpomodoro
  deploymentTarget:
    macOS: "14.0"
targets:
  DeskPetPomodoro:
    type: application
    platform: macOS
    sources:
      - path: DeskPetPomodoro
    info:
      path: DeskPetPomodoro/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        CFBundleIdentifier: com.deskpetpomodoro.DeskPetPomodoro
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ATSApplicationFontsPath: "."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_VERSION: "5.0"
